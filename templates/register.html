{% extends "base.html" %}
{% block body_class %}bg-slate-900{% endblock %}
{% block content %}
<div class="min-h-[85vh] flex items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] shadow-2xl overflow-hidden flex flex-col md:flex-row w-full max-w-6xl min-h-[600px] relative">
        
        <!-- Left Side (Dark Slate Background) -->
        <div class="md:w-1/2 bg-gradient-to-b from-slate-900 to-slate-800 text-white flex flex-col justify-center items-center py-16 pl-10 pr-10 md:pr-28 relative">

            <!-- Cloud Edge Simulator (3D Layered Circles) -->
            <div class="absolute right-0 top-0 h-full w-48 hidden md:block pointer-events-none translate-x-1/2 z-20">
                <!-- Cloud 1 -->
                <div class="absolute top-[-10%] right-[15px] w-48 h-48 bg-white rounded-full opacity-20"></div>
                <div class="absolute top-[-10%] right-0 w-48 h-48 bg-white rounded-full"></div>

                <!-- Cloud 2 -->
                <div class="absolute top-[10%] right-[30px] w-56 h-56 bg-white rounded-full opacity-20"></div>
                <div class="absolute top-[10%] right-0 w-56 h-56 bg-white rounded-full"></div>

                <!-- Cloud 3 -->
                <div class="absolute top-[35%] right-[30px] w-48 h-48 bg-white rounded-full opacity-20"></div>
                <div class="absolute top-[35%] right-0 w-48 h-48 bg-white rounded-full"></div>

                <!-- Cloud 4 -->
                <div class="absolute top-[55%] right-[25px] w-64 h-64 bg-white rounded-full opacity-20"></div>
                <div class="absolute top-[55%] right-0 w-64 h-64 bg-white rounded-full"></div>

                <!-- Cloud 5 -->
                <div class="absolute top-[75%] right-[15px] w-56 h-56 bg-white rounded-full opacity-20"></div>
                <div class="absolute top-[75%] right-0 w-56 h-56 bg-white rounded-full"></div>

                <!-- Cloud 6 -->
                <div class="absolute top-[90%] right-[15px] w-48 h-48 bg-white rounded-full opacity-20"></div>
                <div class="absolute top-[90%] right-0 w-48 h-48 bg-white rounded-full"></div>
            </div>
            
            <div class="relative z-30 flex flex-col items-center">
                <h2 class="text-2xl font-medium mb-8">Welcome to</h2>
                
                <!-- Logo -->
                <div class="w-28 h-28 bg-white rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(255,255,255,0.1)] mb-4">
                    <img src="{{ url_for('static', filename='logo.png') }}" class="w-16 h-16 object-contain" alt="NLIDB Logo">
                </div>
                <h1 class="text-4xl font-bold tracking-wider mb-10">NLIDB</h1>
                
                <p class="text-slate-300 text-sm text-center opacity-80 max-w-[250px] leading-relaxed">
                    Interact with your database using natural language NLIDB technology.
                </p>
            </div>
        </div>

        <!-- Right Side (White Form Area) -->
        <div class="md:w-1/2 bg-white p-10 md:py-16 md:pr-16 md:pl-24 flex flex-col justify-center relative z-10">
            <h2 class="text-3xl font-bold text-gray-800 mb-10 text-center md:text-left tracking-tight">Create your account</h2>
            
            <form method="POST" action="{{ url_for('register') }}" class="w-full space-y-8">
                <!-- Name -->
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Name</label>
                    <div class="relative">
                        <input type="text" name="name" placeholder="Enter your name" required 
                               class="w-full bg-transparent border-0 border-b-2 border-blue-200 focus:border-blue-500 focus:ring-0 px-0 py-2.5 text-base transition-colors text-gray-700 placeholder-gray-300">
                    </div>
                </div>
                
                <!-- Email -->
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">E-mail Address</label>
                    <div class="relative">
                        <input type="email" name="email" placeholder="Enter your email" required 
                               class="w-full bg-transparent border-0 border-b-2 border-blue-200 focus:border-blue-500 focus:ring-0 px-0 py-2.5 text-base transition-colors text-gray-700 placeholder-gray-300">
                    </div>
                </div>
                
                <!-- Password -->
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" name="password" placeholder="Enter your password" required 
                               class="w-full bg-transparent border-0 border-b-2 border-blue-200 focus:border-blue-500 focus:ring-0 px-0 py-2.5 text-base transition-colors text-gray-700 placeholder-gray-300">
                    </div>
                </div>
                
                <!-- Terms checkbox -->
                <div class="flex items-center pt-2">
                    <input type="checkbox" required class="h-4 w-4 text-blue-600 border-gray-300 rounded cursor-pointer">
                    <span class="ml-2 text-sm text-gray-500">By Signing Up, I agree with <a href="#" class="text-blue-600 hover:underline">Terms & Conditions</a></span>
                </div>
                
                <!-- Buttons -->
                <div class="flex items-center gap-4 pt-6">
                    <button type="submit" class="bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white px-10 py-3 rounded-full text-base font-semibold shadow-md transition-transform transform hover:-translate-y-0.5">
                        Sign Up
                    </button>
                    <a href="{{ url_for('login') }}" class="px-10 py-3 rounded-full text-base font-semibold text-gray-500 border border-gray-300 hover:bg-gray-50 transition-colors">
                        Sign In
                    </a>
                </div>
            </form>
        </div>
        
    </div>
</div>
{% endblock %}
